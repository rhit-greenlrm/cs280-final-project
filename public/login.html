<!DOCTYPE html>
<html>

<head>
    <title>Log In</title>
    <link rel="stylesheet" href="styles/style.css">
    <script type="text/javascript" src="scripts/loginScript.js"></script>
</head>

<body>
    <main>
        <h1>CS280 Pet Adoption Program</h1>
        <section>
            <div id="login">
                    <p>
                        <label for="username_text">Username:</label>
                        <input id="username_text" type="text" name="username">
                    </p>
                    <p>
                        <label for="password_text">Password:</label>
                        <input id="password_text" type="password" name="password">
                    </p>
                    <input id="create_button" type="submit" value="Create Account" class="hide">
                    <button id="switch" type="button" onclick="swapBetweenLoginAndCreate()">Create Account</button>
                    <button id="login_button" type="button" onclick="login()">Log in</button>
            </div>
        </section>
    </main>
</body>
</html>
