<!DOCTYPE html>
<html>

<head>
    <title>Log In</title>
    <link rel="stylesheet" href="styles/style.css">
    <script type="text/javascript" src="scripts/loginScript.js"></script>
</head>

<body>
    <main>
        <!-- Display fake logo image here -->

        <h1>CS280 Pet Adoption Program</h1>
        
        <section>
        <form id="loginForm">
            <div id="login">
                    <p>
                        <label for username_text>Username:</label>
                        <input id="username_text" type="text" name="username" required>
                    </p>
                    <p>
                        <label for password_text>Password:</label>
                        <input id="password_text" type="password" name="password" required>
                    </p>
            </div>

            <div id="buttons">
                <button id="submit" type="submit">Log in</button>
                <button id="switch" type="button">Create Account</button>            
            </div>
        </form>
        </section>

    </main>
</body>
</html>
