<!DOCTYPE html>
<html>

<head>
    <title>Add Pet</title>
    <link rel="stylesheet" href="styles/style.css">
    <script type="text/javascript" src="scripts/addPet.js"></script> 
</head>

<body>

    <!-- fix banner visual-->
    <section id="petbanner">
        <h2>Add New Pet</h2>
        <!-- fake logo -->
    </section>

    <!--make inputs and labels bigger/properly centered-->
    <div id="addPetForm">
    <!-- form including all upload criteria-->
        <!--image upload-->

        <p><label for species>Species: </label>
        <select id="species" name="species" required>
            <option value="" disabled selected>Select one: </option>
            <option value="cat">Cat</option>
            <option value="dog">Dog</option>
            <option value="bird">Bird</option>
            <option value="bunny">Bunny</option>
        </select></p>

        <p><label for age>Age: </label>
        <select id="age" name="age" required>
            <option value="" disabled selected>Select one: </option>
            <option value="baby">0-3 Years</option>
            <option value="young">3-5 Years</option>
            <option value="middleage">5-10 Years</option>
            <option value="old">10+ Years</option>
        </select></p>

        <p><label for personality>Personality: </label>
        <select id="personality" name="personality" required>
            <option value="" disabled selected>Select one: </option>
            <option value="calm">Calm</option>
            <option value="energetic">Energetic</option>
            <option value="aggressive">Aggressive</option>
            <option value="friendly">Friendly</option>
        </select></p>

        <p><label for notes>Additional Notes: </label>
        <input id="notes" name="notes" type="text"></p>

        <button type="submit" id="submit" name="submit">Add</button>
    
    </div>

</body>
</html>
