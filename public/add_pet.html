<!DOCTYPE html>
<html>

<head>
    <title>Add Pet</title>
    <link rel="stylesheet" href="styles/style.css">
    <script type="text/javascript" src="scripts/addPet.js"></script> 
</head>

<body>
    <!-- Add Pet Banner -->
    <section id="petbanner">
        <h2>Add New Pet</h2>
        <!-- fake logo -->
    </section>

    <!-- form including all upload criteria-->
        <!--image upload-->

        <label for species>Species: </label>
        <select id="species" name="species">
            <option value="cat">Cat</option>
            <option value="dog">Dog</option>
            <option value="bird">Bird</option>
            <option value="bunny">Bunny</option>
        </select>

        <label for age>Age: </label>
        <select id="age" name="age">
            <option value="baby">0-3 Years</option>
            <option value="young">3-5 Years</option>
            <option value="middleage">5-10 Years</option>
            <option value="old">10+ Years</option>
        </select>

        <label for personality>Personality: </label>
        <select id="personality" name="personality">
            <option value="calm">Calm</option>
            <option value="energetic">Energetic</option>
            <option value="aggressive">Aggressive</option>
            <option value="friendly">Friendly</option>
        </select>

        <input id="notes" name="notes" type="text">

</body>
</html>
